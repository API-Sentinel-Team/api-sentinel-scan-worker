[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-sentinel-scan-worker"
version = "0.2.0"
description = "API Sentinel scan-worker service"
requires-python = ">=3.11"
dependencies = [
  "sentinel-core @ git+https://github.com/API-Sentinel-Team/api-sentinel-core.git@v0.2.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.2.0",
  "pytest-asyncio==0.23.6",
  "pytest-cov>=5,<7",
]

[tool.setuptools.packages.find]
include = ["sentinel_worker*"]
